name: Bootstrap VLA Failover Lockfile

on:
  push:
    branches: [failover/vla-standalone-2026-08-19]

permissions:
  contents: write

concurrency:
  group: vla-failover-lockfile
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: failover/vla-standalone-2026-08-19

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Generate exact npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo 'package-lock.json ya está fijado.'
            exit 0
          fi
          git config user.name 'vla-failover-lock-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'VLA failover: fijar package-lock reproducible [skip ci]'
          git push origin HEAD:failover/vla-standalone-2026-08-19
